<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Proveedores</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="dashboard-layout">
        <div class="sidebar">
            <h2>Sistema Admin</h2>
            <p>Bienvenido, <span id="userName"></span></p>
            <hr>
            <a href="../dashboard/dashboard.html">Dashboard</a>
            <a href="../clientes/clientes.html">Clientes</a>
            <a href="../productos/productos.html">Productos</a>
            <a href="../proveedores/index.html">Proveedores</a>
            <a href="#" id="logout">Cerrar Sesión</a>
        </div>

        <div class="main-content">
            <h1>Gestión de Proveedores</h1>
            
            <!-- Formulario de Registro -->
            <div class="card">
                <h3>Agregar Nuevo Proveedor</h3>
                <form id="formProveedor">
                    <input type="text" id="nombreProveedor" placeholder="Nombre de la Empresa" required>
                    <input type="email" id="emailProveedor" placeholder="Correo de contacto" required>
                    <input type="text" id="telefonoProveedor" placeholder="Teléfono" required>
                    <button type="submit">Guardar Proveedor</button>
                </form>
            </div>

            <!-- Tabla de Registros -->
            <div class="card" style="margin-top: 20px;">
                <h3>Lista de Proveedores</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Email</th>
                            <th>Teléfono</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaProveedores">
                        <!-- Se llena dinámicamente con JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="jsproveedores.js"></script>
</body>
</html>
