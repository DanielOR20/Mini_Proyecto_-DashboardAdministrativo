<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Clientes</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="dashboard-layout">
        <div class="sidebar">

            <h2>Sistema Admin</h2>

            <a href="../dashboard/dashboard.html">Dashboard</a>
            <a href="../clientes/clientes.html">Clientes</a>
            <a href="../productos/productos.html">Productos</a>
            <a href="../proveedores/proveedores.html">Proveedores</a>

            <button id="logout" class="btn-logout">Cerrar Sesión</button>
            
        </div>

        <div class="main-content">
            <h1>Gestión de Clientes</h1>
            <form id="formCliente" style="background: white; padding: 20px; border-radius: 8px;">
                <input type="text" id="nombreCliente" placeholder="Nombre completo" required>
                <input type="email" id="emailCliente" placeholder="Correo" required>
                <button type="submit" class="btn">Guardar Cliente</button>
            </form>
            
            <table>
                <thead>
                    <tr><th>Nombre</th><th>Email</th><th>Acciones</th></tr>
                </thead>
                <tbody id="tablaClientes"></tbody>
            </table>
        </div>
    </div>
    
    <button id="darkModeToggle" class="theme-toggle" title="Cambiar tema">🌙</button>

    <script src="../jsboton/theme-toggle.js"></script>
    <script src="../jsboton/logout.js"></script>
    <script src="jsclientes.js"></script>

</body>
</html>
