<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestión de Productos</title>

    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

    <div class="dashboard-layout">

        <!-- ===== SIDEBAR ===== -->
        <div class="sidebar">

            <h2>Sistema Admin</h2>

            <a href="../dashboard/dashboard.html">
                Dashboard
            </a>

            <a href="../clientes/clientes.html">
                Clientes
            </a>

            <a href="../productos/productos.html">
                Productos
            </a>

            <a href="../proveedores/proveedores.html">
                Proveedores
            </a>

            <button id="logout" class="btn-logout">Cerrar Sesión</button>

        </div>


        <!-- ===== CONTENIDO PRINCIPAL ===== -->
        <div class="main-content">

            <h1>Gestión de Productos</h1>

            <form id="formProducto">

                <input
                    type="text"
                    id="nombreProducto"
                    placeholder="Nombre del producto"
                    required
                >

                <input
                    type="number"
                    id="precioProducto"
                    placeholder="Precio"
                    required
                >

                <button
                    type="submit"
                    class="btn"
                >
                    Guardar Producto
                </button>

            </form>


            <!-- ===== TABLA ===== -->
            <table>

                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Precio</th>
                        <th>Acciones</th>
                    </tr>
                </thead>

                <tbody id="tablaProductos">
                    <!-- Los productos aparecerán aquí -->
                </tbody>

            </table>

        </div>

    </div>


    <button id="darkModeToggle" class="theme-toggle" title="Cambiar tema">🌙</button>

    
    <script src="../Js/theme-toggle.js"></script>
    <script src="../Js/logout.js"></script>
    <script src="jsproductos.js"></script>
</body>

</html>
