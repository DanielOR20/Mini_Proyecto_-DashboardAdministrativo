<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Productos</title>
  <!-- Enlace al archivo CSS en la misma carpeta -->
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <!-- Mismo menú lateral de los anteriores -->
  <div class="main-content">
    <h1>Gestión de Productos</h1>

    <form id="formProducto">
      <input type="text" id="nombreProducto" placeholder="Nombre del producto" required>
      <input type="number" id="precioProducto" placeholder="Precio" required>
      <button type="submit" class="btn">Guardar Producto</button>
    </form>

    <table>
      <thead>
        <tr>
          <th>Producto</th>
          <th>Precio</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tablaProductos">
        <!-- Los productos se agregarán dinámicamente con JavaScript -->
      </tbody>
    </table>
  </div>

    <button id="darkModeToggle" class="theme-toggle">🌙</button>
  
    <script src="../Js/theme-toggle.js"></script>

</body>
</html>
