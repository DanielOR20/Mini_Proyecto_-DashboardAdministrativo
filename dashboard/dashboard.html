<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="../css/styles.css">
    <!-- CDN de Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="dashboard-layout">
        <div class="sidebar">
            <h2>Sistema Admin</h2>
            <p>Bienvenido, <span id="userName"></span></p>
            <hr>
            <a href="../dashboard/dashboard.html">Dashboard</a>
            <a href="../clientes/clientes.html">Clientes</a>
            <a href="../productos/productos.html">Productos</a>
            <a href="../proveedores/proveedores.html">Proveedores</a>

            <button id="btnCerrarSesion" class="btn-logout">
            Cerrar sesión
        </button>
        
        </div>

        <div class="main-content">
            <h1>Resumen del Sistema</h1>
            
            <div class="cards">
                <div class="card">
                    <h3>Total Clientes</h3>
                    <p id="totalClientes">0</p>
                </div>
                <div class="card">
                    <h3>Total Productos</h3>
                    <p id="totalProductos">0</p>
                </div>
            </div>

            <!-- Contenedor del Gráfico -->
            <div class="chart-card">
                <canvas id="summaryChart"></canvas>
            </div>
        </div>
    </div>

    <button id="darkModeToggle" class="theme-toggle" title="Cambiar tema">🌙</button>

    <!-- Scripts -->
    <script src="dashboard.js"></script>
    <script src="../js/theme-toggle.js"></script>
</body>
</html>
